<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>TabSonar — Enable voice</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; max-width: 460px; margin: 12vh auto; padding: 0 24px;
           color: #1f2328; background: #fff; text-align: center; }
    @media (prefers-color-scheme: dark) { body { color: #e8eaed; background: #1f2023; } }
    h1 { font-size: 20px; }
    button { margin-top: 18px; padding: 10px 20px; border: none; border-radius: 999px;
             background: #0b1220; color: #fff; font-size: 14px; cursor: pointer; }
    @media (prefers-color-scheme: dark) { button { background: #e8eaed; color: #202124; } }
    .status { margin-top: 16px; font-size: 13px; color: #5f6368; }
    .ok { color: #1e8e3e; }
    .err { color: #d93025; }
  </style>
</head>
<body>
  <h1>🎙️ Enable voice search</h1>
  <p>TabSonar needs microphone access once. After you allow it, voice search works
     inside the popup from now on. You can close this tab afterwards.</p>
  <button id="grant">Allow microphone</button>
  <div class="status" id="status"></div>
  <script src="mic-setup.js"></script>
</body>
</html>
